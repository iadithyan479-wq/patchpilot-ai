[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot-ai"
version = "0.1.0"
description = "A lightweight AI-assisted code review CLI for Git diffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PatchPilot contributors" }]
keywords = ["ai", "code-review", "git", "cli", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
patchpilot = "patchpilot:main"

[tool.setuptools]
py-modules = ["patchpilot"]
